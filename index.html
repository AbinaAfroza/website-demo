<style>
    #formTable {
        border: 3px solid black;
        border-collapse: separate;
        padding: 10px;
    }


    #formTable table {
        border: 3px;
        border-color: black;
        border-style: solid;
        padding: 10px;
    }

    #formTable tr,
    #formTable td {

        border: 3px;
        border-color: black;
        border-style: solid;

    }

    .save-cell {
        padding: 0;
    }

    .save-btn {
        width: 100%;
        height: 100%;
        display: block;

        text-align: center;
        font-size: 16px;
        font-weight: bold;

        border: none;
        background: transparent;
        cursor: pointer;
        background-color: rgb(139, 139, 203);

    }
     #tableManupulate {
        border: 3px solid black;
        border-collapse: separate;
        padding: 5px;
    }
    #tableManupulate table{
        border: 3px;
        border-color: black;
        border-style: double;
        padding: 10px;
    }
    #tableManupulate tr, #tableManupulate td ,#tableManupulate th{
        border: 3px;
        border-color: black;
        border-style: double;
    }
</style>
<center>


    <h1>Student Form</h1>
    <form onsubmit="addData(event)">

        <table id="formTable">

            <tr>
                <td>Name:</td>
                <td><input id="name" type="text" placeholder="enter your name" required></td>
            </tr>

            <tr>
                <td>Age:</td>
                <td><input id="age" type="number"></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td><input type="radio" name="gender">Male <input type="radio" name="gender">Female
            </tr>


            <tr>
                <td>Email:</td>
                <td><input id="email" type="email" placeholder="enter your email"></td>
            </tr>


            <tr>
                <td>Select a course:</td>
                <td>
                    <select id="course">
                        <option>Python</option>
                        <option>java script</option>
                    </select>
                </td>
            </tr>


            <tr>

                <td colspan="2" class="save-cell">
                    <button  class="save-btn">Save</button>
                </td>

            </tr>



        </table>

    </form>


<table id="tableManupulate">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Email</th>
        <th>Course</th>
        <th>Action</th>
    </tr>
</table>






</center>


<script>
function addData(event){
event.preventDefault();
    //event.preventDefault();
var name = document.getElementById("name").value;
var age =document.getElementById("age").value;
var gender = document.querySelector('input[name="gender"]:checked').value;
var email = document.getElementById("email").value;
var course = document.getElementById("course").value;


var tableManupulated = document.getElementById("tableManupulate");
 var  rowManupulated = tableManupulated.insertRow();

   rowManupulated.insertCell(0).innerHTML = name;
    rowManupulated.insertCell(1).innerHTML = age;
     rowManupulated.insertCell(2).innerHTML =gender;
      rowManupulated.insertCell(3).innerHTML =email;
       rowManupulated.insertCell(4).innerHTML =course;
var actionCell = rowManupulated.insertCell(5);
actionCell.innerHTML = "<button onclick='deleteRow(this)'>Delete</button>";
      document.querySelector("form").reset();

     
} 
function deleteRow(btn) {
    var row = btn.parentNode.parentNode;
    row.remove();
}

</script>
